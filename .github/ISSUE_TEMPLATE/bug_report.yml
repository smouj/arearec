name: Bug report
description: Report a reproducible AreaRec problem.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version
    validations:
      required: true
  - type: input
    id: backend
    attributes:
      label: Capture backend (WGC/DXGI)
  - type: input
    id: dpi
    attributes:
      label: Display resolution and scaling
