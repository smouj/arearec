name: Native CI

on:
  push:
  pull_request:

jobs:
  native:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify brand assets
        shell: pwsh
        run: |
          $required = @('assets/mark.png', 'assets/logo.png', 'assets/social-banner.png', 'assets/AreaRec.ico')
          foreach ($asset in $required) {
            if (-not (Test-Path $asset)) { throw "Missing required brand asset: $asset" }
          }
      - name: Restore
        run: dotnet restore AreaRec.sln --runtime win-x64
      - name: Build
        run: dotnet build AreaRec.sln --configuration Release --no-restore
      - name: Format and analyzer checks
        run: dotnet format AreaRec.sln --verify-no-changes --no-restore
      - name: Native dependency guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nativeProjects = @('src/AreaRec.App','src/AreaRec.Core','src/AreaRec.Capture','src/AreaRec.Graphics','src/AreaRec.Media','src/AreaRec.Platform.Windows') | Where-Object { Test-Path $_ }
          $forbidden = 'ffmpeg|ffmpeg\.exe|python|ProcessStartInfo|Process\.Start|HttpClient|WebClient|Socket|TcpClient|UdpClient|NetworkStream'
          $hits = Get-ChildItem -Path $nativeProjects -Recurse -File -Filter *.cs |
            Where-Object { $_.FullName -notmatch '[\\/](obj|bin)[\\/]' } |
            Select-String -Pattern $forbidden -CaseSensitive:$false
          if ($hits) {
            $hits | ForEach-Object { Write-Host "  $($_.Path):$($_.LineNumber): $($_.Line.Trim())" }
            Write-Error "Forbidden runtime dependency found in native sources."
            exit 1
          }
          Write-Host "Native dependency guard passed: no forbidden runtime dependencies."

      - name: Legacy runtime guard
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ignored = '[\\/](\.git|obj|bin|dist|build|artifacts)[\\/]'
          $legacy = Get-ChildItem -Path . -Recurse -File -Force |
            Where-Object { $_.FullName -notmatch $ignored } |
            Where-Object { $_.Name -like '*.py' -or $_.Name -like '*.pyc' -or $_.Name -eq 'pyproject.toml' }
          if ($legacy) {
            $legacy | ForEach-Object { Write-Host "  $($_.FullName)" }
            Write-Error "Legacy Python/FFmpeg artifacts found."
            exit 1
          }
          if (Test-Path 'bin') {
            $bins = @(Get-ChildItem -Path 'bin' -Recurse -File -Include *.exe -ErrorAction SilentlyContinue)
            if ($bins.Count -gt 0) {
              $bins | ForEach-Object { Write-Host "  $($_.FullName)" }
              Write-Error "Legacy FFmpeg binaries found."
              exit 1
            }
          }
          Write-Host "Legacy runtime guard passed: no Python or FFmpeg artifacts."

      - name: Core tests
        run: dotnet run --project tests/AreaRec.Core.Tests/AreaRec.Core.Tests.csproj --configuration Release --no-build
      - name: Media Foundation smoke
        run: dotnet run --project tests/AreaRec.Media.Smoke/AreaRec.Media.Smoke.csproj --configuration Release --no-build -- playback
      - name: Media Foundation audio/video smoke
        run: dotnet run --project tests/AreaRec.Media.Smoke/AreaRec.Media.Smoke.csproj --configuration Release --no-build -- audio-mp4
      - name: Media Foundation abort cleanup smoke
        run: dotnet run --project tests/AreaRec.Media.Smoke/AreaRec.Media.Smoke.csproj --configuration Release --no-build -- abort
      - name: Publish portable package
        shell: pwsh
        run: ./PUBLISH_PORTABLE.ps1
